<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Database OCC</title>
<!-- db-occ – app di consultazione e modifica, v3 (Claudia, 08/11/2026: dati omologa per il Ministero; IBAN esteri; estratto conto con saldo; colonne ridimensionabili; stampa/PDF). Apri il file nel browser. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f6f7f9;--pane:#fff;--ink:#1d2430;--mute:#667085;--line:#e3e6eb;--acc:#1f6f5c;--acc2:#e7f3ef;--warn:#b54708;--warnbg:#fff4e5;--err:#b42318;--errbg:#fdecea;--ok:#067647;--th:#1f4e79;--thtx:#ffffff}
@media (prefers-color-scheme:dark){:root{--th:#2a5f94;--bg:#14171c;--pane:#1c2027;--ink:#e6e8eb;--mute:#98a2b3;--line:#2e343e;--acc:#4fbf9f;--acc2:#1d3530;--warn:#f79009;--warnbg:#3a2a12;--err:#f97066;--errbg:#3b1d1a;--ok:#47cd89}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--pane);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:16px;margin:0;color:var(--acc)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:6px 10px;border-radius:6px;color:var(--mute);cursor:pointer;font:inherit}
nav button.on{background:var(--acc2);color:var(--acc);font-weight:600}
header .chi{margin-left:auto;color:var(--mute);font-size:12px}
main{padding:16px;max-width:1400px;margin:0 auto}
.filtri{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:10px}
.filtri label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--pane);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
textarea{width:100%;min-height:60px}
button.b{font:inherit;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:6px;padding:5px 12px;cursor:pointer}
button.b2{font:inherit;border:1px solid var(--line);background:var(--pane);color:var(--ink);border-radius:6px;padding:5px 12px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.tab{background:var(--pane);border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:calc(100vh - 190px)}
table{border-collapse:collapse;width:100%}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}
th{position:sticky;top:0;vertical-align:bottom;line-height:1.2;background:var(--th);font-size:12px;color:var(--thtx);font-weight:700;cursor:pointer;user-select:none;border-bottom:0}
tbody tr.cl{cursor:pointer}
th .rz{position:absolute;right:-3px;top:0;bottom:0;width:7px;cursor:col-resize;z-index:1}
th .rz:hover,th .rz.on{background:var(--acc);opacity:.5}
table.fissa{table-layout:fixed}
table.fissa th,table.fissa td{overflow:hidden;text-overflow:ellipsis}
table.fissa td.wrap{min-width:0}
tbody tr.cl:hover{background:var(--acc2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;min-width:240px}
tfoot td{font-weight:600;position:sticky;bottom:0;background:var(--pane)}
.conta{color:var(--mute);font-size:12px;margin:6px 2px}
.tag{display:inline-block;padding:0 6px;border-radius:10px;font-size:12px;background:var(--acc2);color:var(--acc)}
.tag.w{background:var(--warnbg);color:var(--warn)}
.tag.e{background:var(--errbg);color:var(--err)}
.sopra{background:var(--acc2)}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.15);overflow:auto;transform:translateX(105%);transition:transform .2s;z-index:10}
#drawer.on{transform:none}
#drawer .top{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--pane);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
#drawer .top h2{margin:0;font-size:16px;flex:1}
#drawer .corpo{padding:12px 16px}
.box{background:var(--pane);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px;overflow-x:auto}
.box td input{min-width:0;width:100%}
.box h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.griglia label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:2px}
.griglia label.l2{grid-column:span 2}
.griglia label.chk{flex-direction:row;align-items:center;gap:6px;color:var(--ink)}
.azioni{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.nota{font-size:12px;color:var(--mute)}
.avviso{padding:8px 10px;border-radius:6px;background:var(--warnbg);color:var(--warn);font-size:13px;margin:8px 0}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:8px 14px;border-radius:6px;background:var(--ink);color:var(--bg);display:none;z-index:20;max-width:90%}
#toast.e{background:var(--err);color:#fff}
.login{max-width:380px;margin:12vh auto;background:var(--pane);border:1px solid var(--line);border-radius:10px;padding:24px}
.login h1{font-size:18px;margin:0 0 4px;color:var(--acc)}
.login label{display:flex;flex-direction:column;gap:3px;margin:12px 0;font-size:13px;color:var(--mute)}
.login input{width:100%}
.mod{outline:2px solid var(--warn)}
.st{display:inline-block;min-width:28px;text-align:center;border-radius:5px;padding:1px 5px;cursor:pointer;font-weight:600;font-size:12px;border:1px solid var(--line);background:var(--pane);color:var(--mute)}
.st.vuoto{opacity:.35}.st:hover{outline:2px solid var(--acc)}
.st.s-dafare{background:var(--bg);color:var(--ink)}
.st.s-incorso{background:var(--acc2);color:var(--acc);border-color:var(--acc)}
.st.s-delega,.st.s-attesa{background:var(--warnbg);color:var(--warn);border-color:var(--warn)}
.st.s-fatto{background:var(--ok);color:#fff;border-color:var(--ok)}
.st.s-nonnec{background:var(--line);color:var(--mute)}
.st.s-doc{background:#fff3b0;color:#7a5d00;border-color:#c9a400}
.st.s-sosp{background:var(--errbg);color:var(--err);border-color:var(--err)}
.avz{display:inline-flex;align-items:center;gap:5px;cursor:pointer;padding:0 4px;border-radius:5px;vertical-align:middle}
.avz:hover{outline:2px solid var(--acc)}
textarea.nota-tappa{width:100%;min-height:32px;max-height:150px;overflow-y:auto;resize:vertical;line-height:1.35;font-size:13px}
.avz .bar{display:inline-block;width:46px;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.avz .bar i{display:block;height:100%;background:var(--acc)}
.avz b{font-size:12px;font-variant-numeric:tabular-nums;min-width:30px}
.avz.ferma b{color:var(--warn)}
.legenda{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:4px 2px 8px}
#stampa{display:none}
@media print{
  @page{size:A4 landscape;margin:11mm}
  body{background:#fff;color:#000;font-size:9pt}
  body>*:not(#stampa){display:none!important}
  #stampa{display:block}
  #stampa h1{font-size:13pt;margin:0 0 2px;color:#000}
  #stampa .sotto{font-size:9pt;color:#333;margin-bottom:8px}
  #stampa table{width:100%!important;border-collapse:collapse;table-layout:auto}
  #stampa th,#stampa td{position:static;white-space:normal;border-bottom:1px solid #bbb;padding:3px 5px;color:#000;background:#fff;font-size:8.5pt}
  #stampa th{background:#1f4e79;color:#fff;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #stampa tr{break-inside:avoid}
  #stampa thead{display:table-header-group}
  #stampa tfoot td{font-weight:700;border-top:1.5px solid #000}
  #stampa .tag{background:none;color:#000;padding:0}
  #stampa .riep{display:flex;gap:24px;margin:6px 0 8px;font-size:9pt}
  #stampa .pie{margin-top:8px;font-size:8pt;color:#555}
}
@media (max-width:700px){main{padding:10px}.griglia label.l2{grid-column:span 1}}
</style>
</head>
<body>
<div id="app"></div>
<div id="drawer"><div class="top"><h2 id="dtit"></h2><button class="b2" onclick="chiudi()">Chiudi ✕</button></div><div class="corpo" id="dcorpo"></div></div>
<div id="toast"></div>
<div id="stampa"></div>
<script>
'use strict';
const URL_DB = 'https://vnenmfmmvgkimnkvxpxy.supabase.co';
const CHIAVE_PUBBLICA = 'sb_publishable_RRD3RBBWok5kyXVN42ngEg_icgbHjM9';   // chiave pubblica (publishable): fatta per stare nella pagina, da sola non apre i dati
const FASI = ['contatto','preventivo','incarico','caricata','nominato','depositata','omologata','chiusa'];
const TIPI = ['LP','PD','AD','IN','ND'];
// stati di Lexdebita nell'ordine della pratica (per filtro e ordinamento dell'elenco procedure)
const STATI_LD = ['Acquisita', 'Assegnata al gestore', 'Consegnata dal gestore (Pronta per deposito)', 'Depositata', 'Omologata', 'Conclusa', 'Rinunciata', 'Rigettata', 'Improcedibile', 'Inammissibile'];
const TIPI_DESCR = {LP: 'Liquidazione controllata (ex Liquidazione del patrimonio)', PD: 'Ristrutturazione dei debiti del consumatore (ex Piano del consumatore)', AD: 'Concordato minore (ex Accordo di composizione della crisi)', IN: 'Esdebitazione del debitore incapiente', ND: 'Da definire'};
const tipoTit = t => t ? `<span title="${h(TIPI_DESCR[t] || t)}" style="cursor:help;border-bottom:1px dotted">${h(t)}</span>` : '';
const STATI_BON = ['proposto','sospeso','fatto','annullato'];
let sb = null, api = null, utente = null;
const S = {gestori: [], codici: [], elenco: [], avz: {}, tab: 'procedure'};

// ---------- utilità ----------
const h = v => v == null ? '' : String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const euro = v => v == null || v === '' ? '' : Number(v).toLocaleString('it-IT', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const data = v => v ? v.slice(0, 10).split('-').reverse().join('/') : '';
const oggi = () => new Date().toISOString().slice(0, 10);
const somma = (a, f) => a.reduce((s, x) => s + (Number(f(x)) || 0), 0);
const $ = s => document.querySelector(s);
function toast(t, err) { const e = $('#toast'); e.textContent = t; e.className = err ? 'e' : ''; e.style.display = 'block'; clearTimeout(e._t); e._t = setTimeout(() => e.style.display = 'none', err ? 7000 : 3000); }
const nomeG = id => { const g = S.gestori.find(x => x.id === id); return g ? g.cognome + ' ' + g.nome : ''; };
const optG = (sel, vuoto = '—') => `<option value="">${vuoto}</option>` + S.gestori.map(g => `<option value="${g.id}" ${g.id == sel ? 'selected' : ''}>${h(g.cognome + ' ' + g.nome)}</option>`).join('');
const opt = (arr, sel, vuoto) => (vuoto != null ? `<option value="">${vuoto}</option>` : '') + arr.map(a => { const [v, t] = Array.isArray(a) ? a : [a, a]; return `<option value="${h(v)}" ${String(v) === String(sel ?? '') ? 'selected' : ''}>${h(t)}</option>`; }).join('');
function scaricaCSV(nome, righe) {
  if (!righe.length) return toast('Niente da esportare');
  const k = Object.keys(righe[0]);
  const csv = [k.join(';')].concat(righe.map(r => k.map(c => { let v = r[c] ?? ''; if (typeof v === 'number') v = String(v).replace('.', ','); v = String(v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(';'))).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], {type: 'text/csv'})); a.download = nome; a.click();
}

// codice fiscale: formato, carattere di controllo, coerenza con cognome e nome (come controllo_cf.py)
const CF_D = [1,0,5,7,9,13,15,17,19,21,2,4,18,20,11,3,6,8,12,14,16,10,22,25,24,23];
function cfParte(s, nome) {
  s = s.toUpperCase().normalize('NFD').replace(/[^A-Z]/g, '');
  let c = [...s].filter(x => !'AEIOU'.includes(x)), v = [...s].filter(x => 'AEIOU'.includes(x));
  if (nome && c.length >= 4) c = [c[0], c[2], c[3]];
  return (c.concat(v, ['X', 'X', 'X'])).slice(0, 3).join('');
}
function cfEsito(cf, cog, nome) {
  if (!cf) return null;
  cf = cf.toUpperCase();
  if (!/^[A-Z]{6}[0-9LMNPQRSTUV]{2}[A-EHLMPRST][0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{3}[A-Z]$/.test(cf)) return 'formato non valido';
  let s = 0;
  for (let i = 0; i < 15; i++) { const ch = cf[i], n = /\d/.test(ch) ? +ch : ch.charCodeAt(0) - 65; s += i % 2 === 0 ? CF_D[n] : n; }
  if (String.fromCharCode(65 + s % 26) !== cf[15]) return 'carattere di controllo errato';
  if (cog && cfParte(cog) !== cf.slice(0, 3)) return 'cognome non coerente';
  if (nome && cfParte(nome, true) !== cf.slice(3, 6)) return 'nome non coerente';
  return null;
}
function ibanOk(i) {
  i = i.replace(/\s/g, '').toUpperCase();
  if (!/^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$/.test(i)) return false;   // anche IBAN esteri (es. LT)
  const s = (i.slice(4) + i.slice(0, 4)).replace(/[A-Z]/g, c => c.charCodeAt(0) - 55);
  let r = 0; for (const d of s) r = (r * 10 + +d) % 97; return r === 1;
}

// ---------- accesso ai dati (Supabase) ----------
function apiSupabase() {
  const chk = ({data, error}) => { if (error) throw new Error(error.message + (error.details ? ' – ' + error.details : '')); return data; };
  const filtra = (q, f) => { for (const [op, c, v] of f || []) q = q[op](c, v); return q; };
  return {
    async list(t, {select = '*', f, order} = {}) {
      const out = [];
      for (let da = 0; ; da += 1000) {            // Supabase restituisce al massimo 1000 righe per volta
        let q = filtra(sb.from(t).select(select), f);
        for (const [c, asc] of order || []) q = q.order(c, {ascending: asc !== false});
        const rows = chk(await q.range(da, da + 999));
        out.push(...rows); if (rows.length < 1000) return out;
      }
    },
    async insert(t, row) { return chk(await sb.from(t).insert(row).select()); },
    async update(t, match, patch) { let q = sb.from(t).update(patch); for (const k in match) q = q.eq(k, match[k]); const r = chk(await q.select()); if (!r.length) throw new Error('Nessuna riga modificata (permessi?)'); return r; },
    async upsert(t, row, onConflict) { return chk(await sb.from(t).upsert(row, {onConflict}).select()); },
    async rpc(fn, args) { return chk(await sb.rpc(fn, args)); },
  };
}

// ---------- avvio e login ----------
async function avvio() {
  if (window.apiOverride) { api = window.apiOverride; utente = {email: 'prova'}; return entra(); }
  let key = CHIAVE_PUBBLICA || null; if (!key) try { key = localStorage.getItem('dbocc_key'); } catch (e) {}
  if (!key) return schermataChiave();
  sb = supabase.createClient(URL_DB, key, {db: {schema: 'occ'}, auth: {persistSession: true}});
  api = apiSupabase();
  const {data: {session}} = await sb.auth.getSession();
  if (session) { utente = session.user; return entra(); }
  schermataLogin();
}
function schermataChiave() {
  $('#app').innerHTML = `<div class="login"><h1>Database OCC</h1><div class="nota">Primo avvio su questo computer</div>
  <label>Chiave pubblica del progetto (Supabase → Project Settings → API Keys → «Publishable key», inizia con sb_publishable_)<input id="k" autocomplete="off"></label>
  <button class="b" onclick="salvaChiave()">Salva</button><p class="nota">La chiave pubblica da sola non apre i dati: serve anche il login.</p></div>`;
}
function salvaChiave() { const k = $('#k').value.trim(); if (!k) return; try { localStorage.setItem('dbocc_key', k); } catch (e) { return toast('Il browser non permette di salvare la chiave', true); } avvio(); }
function schermataLogin(msg) {
  $('#app').innerHTML = `<div class="login"><h1>Database OCC</h1><div class="nota">Procedure, Gestori, incassi e bonifici</div>
  <form onsubmit="event.preventDefault();login()"><label>Email<input id="em" type="email" autocomplete="username" required></label>
  <label>Password<input id="pw" type="password" autocomplete="current-password" required></label>
  <button class="b" type="submit">Entra</button> ${msg ? `<p class="tag e">${h(msg)}</p>` : ''}</form>
  ${CHIAVE_PUBBLICA ? '' : `<p class="nota"><a href="#" onclick="localStorage.removeItem('dbocc_key');avvio();return false">Cambia chiave pubblica</a></p>`}</div>`;
}
async function login() {
  const {data, error} = await sb.auth.signInWithPassword({email: $('#em').value, password: $('#pw').value});
  if (error) return schermataLogin('Accesso non riuscito: ' + error.message);
  utente = data.user; entra();
}
async function esci() { if (sb) await sb.auth.signOut(); location.reload(); }

async function entra() {
  S.me = {ruolo: 'admin'};
  try { const r = await api.list('utenti_app'); if (r && r[0]) S.me = r[0]; } catch (e) {}
  if (S.me.cambio_password) return schermataPrimaPassword();
  const vol = S.me.ruolo === 'volenteroso';
  if (vol) S.tab = 'adempimenti';
  const schede = vol ? [['adempimenti', 'Condivise']] : [['procedure','Procedure'],['adempimenti','Condivise'],['gestori','Gestori'],['incassi','Incassi'],['estratto','Estratto conto'],['dapagare','Da pagare'],['bonifici','Bonifici'],['report','Report DGSTAT'],['registro','Registro modifiche']];
  $('#app').innerHTML = `<header><h1>Database OCC</h1><nav>${schede.map(([k,t]) => `<button data-t="${k}" onclick="vai('${k}')">${t}</button>`).join('')}</nav>
  <span class="chi">${h(S.me.nome || utente.email)} · <a href="#" onclick="cambiaPassword();return false">cambia password</a> · <a href="#" onclick="esci();return false">esci</a></span></header><main id="main">Caricamento…</main>`;
  try {
    [S.gestori, S.codici] = await Promise.all([api.list('gestori', {order: [['cognome'], ['nome']]}), api.list('dgstat_codici', {order: [['ordine']]})]);
    if (!S.gestori.length) { $('#main').innerHTML = '<div class="avviso">Nessun dato visibile: l\'utente non è ancora abilitato nella tabella occ.utenti_app.</div>'; return; }
  } catch (e) { $('#main').innerHTML = `<div class="avviso">Errore di collegamento: ${h(e.message)}</div>`; return; }
  vai(S.tab);
}
function vai(t) {
  S.tab = t; chiudi();
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  ({adempimenti: tabAdempimenti, procedure: tabProcedure, gestori: tabGestori, incassi: tabIncassi, estratto: tabEstratto, dapagare: tabDaPagare, bonifici: tabBonifici, report: tabReport, registro: tabRegistro})[t]();
}
function apri(tit, html) { $('#dtit').textContent = tit; $('#dcorpo').innerHTML = html; $('#drawer').classList.add('on'); $('#drawer').scrollTop = 0; }
function chiudi() { $('#drawer').classList.remove('on'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') chiudi(); });

// tabella generica con ordinamento per colonna
const tTit = t => h(t).replace(/\n/g, '<br>');   // titolo di colonna: \n = a capo
function tabella(id, cols, righe, onclick, piede) {
  const st = S['ord_' + id] || {};
  if (st.c != null) { const c = cols[st.c]; righe = [...righe].sort((a, b) => { let x = c.v(a), y = c.v(b); x = x ?? ''; y = y ?? ''; return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'it', {numeric: true})) * st.d; }); }
  S['rows_' + id] = righe;
  S['cols_' + id] = cols; S['piede_' + id] = piede;
  const lg = larghezze(id, cols.length);
  return `<div class="tab"><table data-id="${id}" ${lg ? `class="fissa" style="width:${lg.reduce((a, b) => a + b, 0)}px"` : ''}>${lg ? `<colgroup>${lg.map(w => `<col style="width:${w}px">`).join('')}</colgroup>` : ''}<thead><tr>${cols.map((c, i) => `<th class="${c.n ? 'n' : ''}" ${c.tip ? `title="${h(c.tip)}"` : ''} onclick="ordina('${id}',${i})">${tTit(c.t)}${st.c === i ? (st.d > 0 ? ' ▲' : ' ▼') : ''}<span class="rz" title="Trascina per allargare o restringere · doppio clic: larghezze automatiche" onmousedown="iniziaRz(event,${i})" onclick="event.stopPropagation()" ondblclick="event.stopPropagation();azzeraRz('${id}')"></span></th>`).join('')}</tr></thead>
  <tbody>${righe.map((r, i) => `<tr class="${onclick ? 'cl' : ''} ${r._cls || ''}" ${onclick ? `onclick="${onclick}(S.rows_${id}[${i}])"` : ''}>${cols.map(c => `<td class="${c.n ? 'n' : ''} ${c.w ? 'wrap' : ''}">${c.f ? c.f(r) : h(c.v(r))}</td>`).join('')}</tr>`).join('')}</tbody>
  ${piede ? `<tfoot><tr>${piede}</tr></tfoot>` : ''}</table></div>`;
}

  if (nota !== ((S.tp.mon || {}).nota || null)) { await api.upsert('procedure_monitoraggio', {procedura_id: pid, nota}, 'procedura_id'); n++; }
  if (!n) return toast('Nessuna modifica (se la pratica è ferma ma verificata, usa «Verificata, nessuna novità»)');
  toast('Avanzamento salvato'); await dopoTappe(pid);
}
async function confermaVerifica() {
  const {pid} = S.tp;
  await api.upsert('procedure_monitoraggio', {procedura_id: pid, nota: (S.tp.mon || {}).nota || null, aggiornato_il: new Date().toISOString()}, 'procedura_id');
  toast('Verifica registrata con la data di oggi'); await dopoTappe(pid);
}
async function dopoTappe(pid) {
  await caricaAvanzamento();
  if (S.tab === 'procedure' && $('#lista')) disegnaProc();
  apriTappe(pid);
}

async function salvaProc() {
  const {p} = S.p, n = leggi('#fproc'), patch = diff(p, n);
  if (!Object.keys(patch).length) return toast('Nessuna modifica');
  await api.update('procedure', {id: p.id}, patch);
  if (patch.fase) await api.upsert('procedure_fasi', {procedura_id: p.id, fase: patch.fase, data: $('#datafase').value || oggi(), nota: 'dall\'app'}, 'procedura_id,fase');
  toast('Procedura salvata'); aggiornaElenco(); apriProcedura(p.id);
}
async function salvaDeb(id) {
  const d = S.p.deb.find(x => x.id === id), n = leggi('#deb' + id);
  if (n.codice_fiscale) { n.codice_fiscale = n.codice_fiscale.toUpperCase(); const e = cfEsito(n.codice_fiscale, n.cognome, n.nome); if (e && !confirm('Codice fiscale: ' + e + '. Salvare lo stesso?')) return; }
  if (!n.cognome) return toast('Il cognome è obbligatorio', true);
  if (n.nome == null) n.nome = '';
  const patch = diff(d, n); if (!Object.keys(patch).length) return toast('Nessuna modifica');
  await api.update('debitori', {id}, patch); toast('Debitore salvato'); aggiornaElenco(); apriProcedura(S.p.p.id);
}
async function salvaNomina(id) {
  const n = S.p.nom.find(x => x.id === id), patch = diff(n, leggi('#nom' + id));
  if (!Object.keys(patch).length) return toast('Nessuna modifica');
  await api.update('procedure_gestori', {id}, patch); toast('Nomina salvata'); aggiornaElenco(); apriProcedura(S.p.p.id);
}
async function nuovaNomina() {
  const n = leggi('#nuovanom'); if (!n.gestore_id) return toast('Scegli il Gestore', true);
  n.gestore_id = Number(n.gestore_id); n.procedura_id = S.p.p.id;
  await api.insert('procedure_gestori', n); toast('Nomina aggiunta'); aggiornaElenco(); apriProcedura(S.p.p.id);
}
async function salvaDgstat() {
  const n = leggi('#nuovodg'); if (!n.codice) return toast('Scegli il codice', true);
  n.debitore_id = Number(n.debitore_id); n.aggiornato_il = oggi();
  const c = S.codici.find(x => x.codice === n.codice); if (c && c.tipologia_min) n.tipologia_min = c.tipologia_min;
  await api.upsert('debitori_dgstat', n, 'debitore_id,anno'); toast('Stato DGSTAT salvato'); aggiornaElenco(); apriProcedura(S.p.p.id);
}
async function nuovoFamiliare() {
  const princ = S.p.deb[0];
  const cog = prompt('Cognome del familiare (MAIUSCOLO)'); if (!cog) return;
  const nome = prompt('Nome') || '';
  const num = parseInt(prompt('Numero di protocollo del familiare nel foglio (anno ' + princ.anno + ')'), 10); if (!num) return;
  await salva(async () => { await api.insert('debitori', {procedura_id: S.p.p.id, anno: princ.anno, numero: num, cognome: cog.toUpperCase(), nome, ruolo: 'familiare'}); toast('Familiare aggiunto'); aggiornaElenco(); apriProcedura(S.p.p.id); });

async function aggiornaElenco() { S.elenco = await api.list('v_elenco_procedure'); if (S.tab === 'procedure' && $('#lista')) disegnaProc(); }
function nuovaProcedura() {

  apri('Nuova procedura', `<div class="box" id="fnuova"><div class="griglia">
   ${campo('anno', 'Anno', anno, 'int')}${campo('numero', 'Protocollo n.', ult + 1, 'int')}${campo('cognome', 'Cognome', '')}${campo('nome', 'Nome', '')}
   ${campo('codice_fiscale', 'Codice fiscale', '')}${scelta('tipo_preventivo', 'Tipo ipotizzato (preventivo)', TIPI, 'ND')}${scelta('fase', 'Fase', FASI, 'contatto')}
   ${campo('data_domanda', 'Data domanda', '', 'date')}${campo('preventivo', 'Preventivo', '', 'num')}${campo('advisor', 'Advisor', '', 'text', 'l2')}
   ${scelta('gestore_id', 'Gestore', optG(null, 'non ancora'))}</div>
   <div class="azioni"><button class="b" onclick="salva(creaProcedura,this)">Crea</button><span class="nota">Ultimo protocollo ${anno}: ${ult}</span></div></div>`);
}
async function creaProcedura() {
  const n = leggi('#fnuova');
  if (!n.anno || !n.numero || !n.cognome) return toast('Anno, numero e cognome sono obbligatori', true);
  if (S.elenco.some(r => r.protocollo === n.anno + '/' + String(n.numero).padStart(3, '0'))) return toast('Protocollo già usato', true);
  if (n.codice_fiscale) { n.codice_fiscale = n.codice_fiscale.toUpperCase(); const e = cfEsito(n.codice_fiscale, n.cognome, n.nome); if (e && !confirm('Codice fiscale: ' + e + '. Salvare lo stesso?')) return; }
  const [p] = await api.insert('procedure', {tipo: 'ND', tipo_preventivo: n.tipo_preventivo, fase: n.fase, data_domanda: n.data_domanda, preventivo: n.preventivo, advisor: n.advisor});
  await api.insert('debitori', {procedura_id: p.id, anno: n.anno, numero: n.numero, cognome: n.cognome.toUpperCase(), nome: n.nome || '', codice_fiscale: n.codice_fiscale, ruolo: 'principale'});
  await api.upsert('procedure_fasi', {procedura_id: p.id, fase: n.fase, data: oggi(), nota: 'creata dall\'app'}, 'procedura_id,fase');
  if (n.gestore_id) await api.insert('procedure_gestori', {procedura_id: p.id, gestore_id: Number(n.gestore_id), ruolo: 'gestore', quota: 100, dal: oggi()});
  toast('Procedura creata'); await aggiornaElenco(); apriProcedura(p.id);
}

S.ridisegna_ade = () => disegnaAde();
function adeOk(x) {           // filtri responsabile / stato / adempimento su una riga di procedure_adempimenti
  const f = S.fa;
  if (f.r && x.responsabile !== f.r && !(x.con || '').includes(f.r)) return false;
  if (f.s === '__aperti' ? !APERTI(x.stato) : f.s && x.stato !== f.s) return false;
  if (f.a && String(x.adempimento_id) !== String(f.a)) return false;
  return true;
}
function disegnaAde() {

  const nomeA = id => (S.ade.find(a => a.id === id) || {}).nome || '';
  if (f.v === 'griglia') {
    const ades = f.a ? S.ade.filter(a => String(a.id) === String(f.a)) : S.ade;
    const filtroRighe = f.r || f.s;
    let righe = S.procAde.filter(pOk);
    if (filtroRighe) righe = righe.filter(p => S.pa.some(x => x.procedura_id === p.procedura_id && adeOk(x)));
    const cella = (p, a) => { const x = S.paMap[p.procedura_id + '_' + a.id];
      const tit = x ? `${a.nome}: ${x.stato}${x.responsabile ? ' – ' + x.responsabile : ''}${x.note ? ' – ' + x.note : ''}` : a.nome + ': non registrato';
      return `<span class="st ${x ? ADE_CLS[x.stato] : 'vuoto'}" title="${h(tit)}" onclick="event.stopPropagation();apriAde(${p.procedura_id},${a.id})">${x ? ADE_SIG[x.stato] : '+'}</span>`; };
    $('#lista').innerHTML = `<div class="conta">${righe.length} procedure condivise</div>` + tabella('ade', [
      {t: 'Protocollo', v: p => p.protocollo}, {t: 'Debitore', v: p => p.debitore}, {t: 'Gestore', v: p => p.gestore},
      {t: 'Indirizzo PEC', v: p => p.pec}, {t: 'Utente PEC', v: p => p.pec_username},
      ...ades.map(a => ({t: a.codice, v: p => { const x = S.paMap[p.procedura_id + '_' + a.id]; return x ? STATI_ADE.indexOf(x.stato) : -1; }, f: p => cella(p, a)}))], righe);
    document.querySelectorAll('#lista thead th').forEach((th, i) => { if (i >= 5) th.title = ades[i - 5].nome + (ades[i - 5].chi_di_norma ? ' (di norma: ' + ades[i - 5].chi_di_norma + ')' : ''); });
  } else {
    const pm = {}; S.procAde.forEach(p => pm[p.procedura_id] = p);
    const righe = S.pa.filter(x => pm[x.procedura_id] && pOk(pm[x.procedura_id]) && adeOk(x) || (q && pm[x.procedura_id] && adeOk(x) && (x.note || '').toLowerCase().includes(q)))
      .map(x => ({...x, _p: pm[x.procedura_id], _ord: (S.ade.find(a => a.id === x.adempimento_id) || {}).ordine || 0}))
      .sort((a, b) => a._p.protocollo.localeCompare(b._p.protocollo, 'it', {numeric: true}) || a._ord - b._ord);

      {t: 'Responsabile', v: x => x.responsabile}, {t: 'Con', v: x => x.con},
      {t: 'Stato', v: x => STATI_ADE.indexOf(x.stato), f: x => `<span class="st ${ADE_CLS[x.stato]}">${ADE_SIG[x.stato]}</span> ${h(x.stato)}${x.avanzamento != null ? ' ' + x.avanzamento + '%' : ''}`},
      {t: 'Inizio', v: x => x.data_inizio, f: x => data(x.data_inizio)}, {t: 'Fine', v: x => x.data_fine, f: x => data(x.data_fine)},

    ${campo('data_inizio', 'Data inizio', x.data_inizio, 'date')}
    ${campo('data_fine', 'Data fine / riscontro', x.data_fine, 'date')}
    ${area('note', 'Note', x.note)}
   </div>
   <div class="azioni"><button class="b" onclick="salvaAde(this)">Salva</button>
    <span class="nota">${x.id ? `Ultima modifica: ${new Date(x.aggiornato_il).toLocaleString('it-IT')} – ${h(x.aggiornato_da || '')}` : 'Non ancora registrato: «Salva» lo crea.'} · Le modifiche restano nel registro; nessuna cancellazione.</span></div></div>`);
}
async function salvaAde(btn) {
  const {pid, aid, x} = S.adeAperto, n = leggi('#fade');
  if (n.avanzamento != null && (isNaN(n.avanzamento) || n.avanzamento < 0 || n.avanzamento > 100)) return toast('Avanzamento tra 0 e 100', true);
  if (n.data_inizio && n.data_fine && n.data_fine < n.data_inizio) return toast('La data di fine è prima di quella di inizio', true);
  await salva(async () => {
    if (x.id) { const d = diff(x, n); if (!Object.keys(d).length) return toast('Nessuna modifica'); await api.update('procedure_adempimenti', {id: x.id}, d); }
    else await api.insert('procedure_adempimenti', {procedura_id: pid, adempimento_id: aid, ...n});
    toast('Salvato');
    const pa = await api.list('procedure_adempimenti'); S.pa = pa; S.paMap = {}; pa.forEach(y => S.paMap[y.procedura_id + '_' + y.adempimento_id] = y);
    if (S.tab === 'adempimenti' && $('#lista')) disegnaAde();
    apriAde(pid, aid);
  }, btn);
}

// ---------- CAMBIO PASSWORD (la password la sceglie e la conosce solo l'utente) ----------
function cambiaPassword() {
  apri('Cambia password', `<div class="box"><form id="fpw" onsubmit="event.preventDefault();salvaPassword(this.querySelector('button'))">
   <div class="griglia"><label>Nuova password<input id="pw1" type="password" autocomplete="new-password" minlength="10" required></label>
   <label>Ripeti la nuova password<input id="pw2" type="password" autocomplete="new-password" minlength="10" required></label></div>
   <div class="azioni"><button class="b" type="submit">Cambia password</button><span class="nota">Almeno 10 caratteri. Conservala nel tuo gestore di password: non la conosce nessun altro, nemmeno l'amministratore.</span></div></form></div>`);
}
function schermataPrimaPassword(msg) {
  $('#app').innerHTML = `<div class="login"><h1>Database OCC</h1><div class="nota">Primo accesso: scegli la tua password personale al posto di quella provvisoria.</div>
  <form onsubmit="event.preventDefault();primaPassword(this.querySelector('button'))">
  <label>Nuova password (almeno 10 caratteri)<input id="pw1" type="password" autocomplete="new-password" minlength="10" required></label>
  <label>Ripeti la nuova password<input id="pw2" type="password" autocomplete="new-password" minlength="10" required></label>
  <button class="b" type="submit">Salva e entra</button> ${msg ? `<p class="tag e">${h(msg)}</p>` : ''}</form>
  <p class="nota">Conservala nel tuo gestore di password: non la conosce nessun altro, nemmeno l'amministratore. · <a href="#" onclick="esci();return false">esci</a></p></div>`;
}
async function primaPassword(btn) {
  const a = $('#pw1').value, b = $('#pw2').value;
  if (a.length < 10) return schermataPrimaPassword('Almeno 10 caratteri');
  if (a !== b) return schermataPrimaPassword('Le due password non coincidono');
  btn.disabled = true;
  const {error} = await sb.auth.updateUser({password: a});
  if (error) return schermataPrimaPassword('Password non cambiata: ' + error.message);
  try { await api.rpc('password_cambiata', {}); } catch (e) { return schermataPrimaPassword('Password cambiata, ma non registrata: ' + e.message); }
  toast('Password cambiata'); entra();
}
async function salvaPassword(btn) {
  const a = $('#pw1').value, b = $('#pw2').value;
  if (a.length < 10) return toast('Almeno 10 caratteri', true);
  if (a !== b) return toast('Le due password non coincidono', true);
  if (!sb) return toast('Non disponibile in modalità di prova', true);
  await salva(async () => { const {error} = await sb.auth.updateUser({password: a}); if (error) throw new Error(error.message); toast('Password cambiata'); chiudi(); }, btn);
}

// ---------- REGISTRO ----------
async function tabRegistro() {
  $('#main').innerHTML = 'Caricamento…';
  const r = await sbUltimi();
  $('#main').innerHTML = `<div class="filtri">${btnStampa('reg')}<span class="conta">Ultime ${r.length} modifiche (tutte restano nel database)</span></div>` + tabella('reg', [
    {t: 'Quando', v: x => x.quando, f: x => new Date(x.quando).toLocaleString('it-IT')}, {t: 'Chi', v: x => x.email || 'import/Claudia'}, {t: 'Tabella', v: x => x.tabella},
    {t: 'Operazione', v: x => x.operazione}, {t: 'Riga', v: x => x.chiave},
    {t: 'Modifica', w: 1, v: x => '', f: x => x.operazione === 'UPDATE' ? Object.keys(x.dopo || {}).map(k => `<b>${h(k)}</b>: ${h(JSON.stringify(x.prima?.[k]))} → ${h(JSON.stringify(x.dopo[k]))}`).join('<br>') : h(JSON.stringify(x.dopo || x.prima).slice(0, 200))}], r);
}
S.ridisegna_reg = () => tabRegistro();
async function sbUltimi() {
  if (sb) { const {data, error} = await sb.from('registro_modifiche').select('*').order('id', {ascending: false}).limit(300); if (error) throw error; return data; }
  return (await api.list('registro_modifiche')).slice(-300).reverse();
}

window.addEventListener('error', e => toast('Errore: ' + e.message, true));
window.addEventListener('unhandledrejection', e => toast('Errore: ' + (e.reason && e.reason.message || e.reason), true));
avvio();
</script>
